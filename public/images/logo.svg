<svg viewBox="75 50 50 65" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="mooncut">
      <circle cx="100" cy="83" r="26" fill="white"/>
      <circle cx="111" cy="75" r="22" fill="black"/>
    </mask>
  </defs>
  <!-- Crescent moon backdrop -->
  <circle cx="100" cy="83" r="26" fill="#f9a8d4" mask="url(#mooncut)"/>

  <!-- Top row of calendar dots -->
  <circle cx="85" cy="70" r="3" fill="#831843" opacity="0.6"/>
  <circle cx="100" cy="70" r="3" fill="#831843" opacity="0.6"/>
  <circle cx="115" cy="70" r="3" fill="#831843" opacity="0.6"/>

  <!-- Wave in the middle replacing middle row -->
  <path d="M 85 83 Q 92.5 78 100 83 T 115 83"
        stroke="#fda4af" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Bottom row of calendar dots -->
  <circle cx="85" cy="96" r="3" fill="#f9a8d4" opacity="0.5"/>
  <circle cx="100" cy="96" r="3" fill="#f9a8d4" opacity="0.5"/>
  <circle cx="115" cy="96" r="3" fill="#f9a8d4" opacity="0.5"/>
</svg>
